server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: service-center-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/service_center_db
    username: devuser
    password: devpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: RepairHubHikariCP
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: U2VydmljZUNlbnRlclN5c3RlbVJlcGFpckh1YjIwMjZKV1RTZWNyZXRLZXlSZWNvbW1lbmRlZERlZXBNaW5kQWd5
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

cloudflare:
  turnstile:
    secret-key: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
    site-key: ${CLOUDFLARE_TURNSTILE_SITE_KEY:3x00000000000000000000FF}
    verify-url: ${CLOUDFLARE_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    ua.repairhub: DEBUG
    org.springframework.security: INFO
